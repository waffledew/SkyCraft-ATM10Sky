modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/chasmlol/SkyCraft/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/chasmlol/SkyCraft"
authors="chasmlol; ATM10SKY compatibility port"
description='''
Runs SkyCraft's Minecraft simulation on NeoForge 1.21.1 for ATM10 To the Sky.
'''

[[mixins]]
config="skycraft.mixins.json"

[[mixins]]
config="skycraft.client.mixins.json"

[[dependencies.skycraft]]
modId="neoforge"
type="required"
versionRange="[21.1.250,)"
ordering="NONE"
side="BOTH"

[[dependencies.skycraft]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.skycraft]]
modId="iris"
type="discouraged"
reason="SkyCraft exports Minecraft rendering into Skyrim; shader compatibility is not implemented yet."
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.skycraft]]
modId="sodium"
type="discouraged"
reason="SkyCraft renderer compatibility is not implemented yet."
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
